<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} &middot; {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ range .AlternativeOutputFormats -}}<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink | safeURL }}" title="{{ $.Site.Title }}">{{ end -}}
  {{ template "_internal/opengraph.html" . }}
  {{ template "_internal/twitter_cards.html" . }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    :root{
      --bg:#fafafa;--bg2:#fff;--bg3:#f3f4f6;
      --b1:#e5e7eb;--b2:#d1d5db;
      --fg:#111827;--fg2:#6b7280;--fg3:#9ca3af;
      --purple:#7c3aed;--purple2:#6d28d9;
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#0c0a09;--bg2:#1c1917;--bg3:#292524;--b1:#292524;--b2:#44403c;--fg:#fafaf9;--fg2:#a8a29e;--fg3:#78716c}
    }

    body{
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg);color:var(--fg);
      line-height:1.65;-webkit-font-smoothing:antialiased;
    }
    ::selection{background:var(--purple);color:#fff}
    a{color:inherit;text-decoration:none}

    .nav-bar{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 1.5rem;pointer-events:none}
    .nav-bar>*{pointer-events:auto}
    .nav-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px;margin-top:.75rem;padding:0 1.25rem;background:var(--bg2);border:1px solid var(--b1);border-radius:.625rem}
    .nav-home{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.875rem;color:var(--fg)}
    .nav-home svg{width:18px;height:18px;color:var(--purple)}
    .nav-links{display:flex;align-items:center}
    .nav-links a{padding:.375rem .75rem;font-size:.8rem;color:var(--fg2);transition:color .15s;font-weight:500}
    .nav-links a:hover{color:var(--fg)}

    .content{max-width:44rem;margin:0 auto;padding:7rem 1.5rem 4rem}
    .content h1{font-size:1.85rem;font-weight:700;letter-spacing:-.015em;margin-bottom:1rem}
    .content h2{font-size:1.2rem;font-weight:600;margin-top:2.5rem;margin-bottom:.75rem}
    .content h3{font-size:1rem;font-weight:600;margin-top:1.75rem;margin-bottom:.5rem}
    .content p,.content li{color:var(--fg2);line-height:1.8;margin-bottom:.75rem}
    .content ul,.content ol{padding-left:1.25rem}
    .content li{margin-bottom:.25rem}
    .content strong{color:var(--fg);font-weight:600}
    .content a{color:var(--purple);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(124,58,237,.3);transition:text-decoration-color .15s}
    .content a:hover{text-decoration-color:var(--purple)}
    .content hr{border:none;border-top:1px solid var(--b1);margin:2rem 0}
    .content blockquote{border-left:3px solid var(--purple);margin:1.5rem 0;padding:.75rem 1rem;background:var(--bg2);border-radius:0 .5rem .5rem 0;color:var(--fg2);font-size:.9rem;line-height:1.7}
    .content table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.825rem;border-radius:.5rem;overflow:hidden;border:1px solid var(--b1)}
    .content th{background:var(--bg3);font-weight:600;color:var(--fg);padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--b1)}
    .content td{padding:.5rem .75rem;color:var(--fg2);border-bottom:1px solid var(--b1)}
    .content tr:last-child td{border-bottom:none}
    .content code{background:var(--bg3);padding:.125rem .375rem;border-radius:.25rem;font-size:.825em;border:1px solid var(--b1);font-family:'JetBrains Mono',monospace}
    .content pre{background:var(--bg2);padding:1rem;border-radius:.5rem;overflow-x:auto;border:1px solid var(--b1);margin:1.5rem 0;font-size:.8rem;line-height:1.6}
    .content img{max-width:100%;border-radius:.5rem;margin:1.5rem 0;border:1px solid var(--b1)}
    .content .lead{font-size:1rem;color:var(--fg2);line-height:1.7;max-width:36rem;margin-bottom:1.5rem}

    .feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem;margin:1.5rem 0}
    .feat-card{background:var(--bg2);padding:1.25rem;border-radius:.5rem;border:1px solid var(--b1);transition:border-color .15s}
    .feat-card:hover{border-color:var(--b2)}
    .feat-card h3{font-size:.9rem;font-weight:600;margin-top:0;margin-bottom:.375rem}
    .feat-card p{font-size:.8rem;color:var(--fg2);line-height:1.6;margin-bottom:0}

    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;font-size:.8rem;font-weight:600;border-radius:.5rem;transition:all .15s;font-family:inherit;text-decoration:none}
    .btn-pri{background:var(--fg);color:var(--bg)}
    .btn-pri:hover{background:var(--purple);color:#fff}
    .btn-ghost{background:var(--bg2);color:var(--fg);border:1px solid var(--b1);text-decoration:none!important}
    .btn-ghost:hover{border-color:var(--b2)}

    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin:1.5rem 0}
    .gallery img{width:100%;border-radius:.5rem;margin:0;border:1px solid var(--b1);transition:transform .2s}
    .gallery img:hover{transform:scale(1.02)}

    .foot{border-top:1px solid var(--b1);padding:2.5rem 1.5rem}
    .foot-inner{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;font-size:.7rem;color:var(--fg3)}
    .foot-inner a{transition:color .15s}
    .foot-inner a:hover{color:var(--fg)}

    @media(max-width:640px){.nav-links{display:none}.content{padding:5rem 1rem 3rem}}
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="nav-inner">
      <a href="/" class="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Glosso Studio
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/features/">Glosso</a>
        <a href="/transitos/">TransitOS</a>
        <a href="https://github.com/IgnacioLD" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </nav>

  <main class="content">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="foot">
    <div class="foot-inner">
      <span>Glosso Studio &copy; {{ now.Format "2006" }}</span>
      <a href="https://github.com/IgnacioLD" target="_blank" rel="noopener">github.com/IgnacioLD</a>
    </div>
  </footer>
</body>
</html>
