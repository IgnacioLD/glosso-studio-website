name: Bug Report
description: Report something that isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Which page were you on?
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome/Edge
        - Firefox
        - Safari
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant console output
      description: Copy any relevant browser console errors or build errors
      render: shell
